# Spring Application Configuration
spring.application.name=subscription-tracker

# Default active profile is 'dev' for immediate out-of-the-box local execution.
# To run with MySQL and Redis, switch to 'mysql': -Dspring.profiles.active=mysql
spring.profiles.active=dev

# Server Port
server.port=8080

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Caching abstraction enabled
spring.cache.cache-names=monthlySummary,categorySummary,upcomingRenewals
