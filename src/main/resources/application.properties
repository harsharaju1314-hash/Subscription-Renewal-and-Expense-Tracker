# ===================================================================
# Subscription Renewal and Expense Tracker Configuration
# ===================================================================

spring.application.name=subscription-tracker
server.port=8080

# Database Configuration (MySQL with environment variable overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/subscription_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Redis Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.cache-names=monthlySummary,categorySummary,upcomingRenewals
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
