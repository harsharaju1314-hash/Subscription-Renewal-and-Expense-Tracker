# ===================================================================
# Local Development Profile ('dev')
# Runs with an embedded H2 database (MySQL compatibility mode)
# and in-memory cache abstraction.
# ===================================================================

spring.datasource.url=jdbc:h2:mem:subscription_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Execute data.sql seed script on startup
spring.sql.init.mode=always

# In dev profile without external Redis, use in-memory cache provider
spring.cache.type=simple
