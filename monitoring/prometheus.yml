global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "fastapi-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          environment: "production"
          service: "fastapi-core"

  - job_name: "flask-analytics-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["analytics-service:5001"]
        labels:
          environment: "production"
          service: "flask-analytics"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "mysql-exporter"
    static_configs:
      - targets: ["mysql-exporter:9104"]
        labels:
          service: "mysql-db"

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis-cache"
