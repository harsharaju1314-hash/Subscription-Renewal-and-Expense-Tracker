apiVersion: 1

providers:
  - name: "Subscription Analytics Platform"
    orgId: 1
    folder: "Production Observability"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
